<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0f16" />
<title>5v5 Match Lobby</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg0: #07090e;
    --bg1: #0d121b;
    --panel: rgba(20, 27, 38, .82);
    --panel-2: rgba(28, 37, 51, .9);
    --line: rgba(255, 255, 255, .07);
    --text: #e6eaf0;
    --muted: #7f8a9c;
    --dim: #4b5566;

    --ct: #5b8fd8;          /* Team A blue */
    --ct-hi: #a8c8ff;
    --ct-deep: #1d3358;
    --t: #e0a63c;           /* Team B gold */
    --t-hi: #ffd58a;
    --t-deep: #4a3413;
    --go: #4f9c3a;          /* ready green */
    --go-hi: #6cc24a;
    --red: #d8463c;

    --cut: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--text);
    font: 600 16px/1.3 "Rajdhani", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(91,143,216,.16), transparent 60%),
      radial-gradient(120% 60% at 100% 100%, rgba(224,166,60,.12), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
      linear-gradient(180deg, var(--bg1), var(--bg0));
    background-attachment: fixed;
    letter-spacing: .3px;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 14px 12px 96px; }
  button, input { font: inherit; letter-spacing: inherit; }
  button { cursor: pointer; border: 0; color: inherit; }

  .cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; margin-bottom: 12px;
    background: linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border-bottom: 2px solid var(--line);
  }
  .eyebrow { font-size: 11px; color: var(--muted); letter-spacing: 2.5px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; line-height: 1.05; }
  .counter { text-align: right; }
  .counter b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1; }
  .counter b span { color: var(--muted); font-size: 18px; }
  .counter small { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  /* ---------- add ---------- */
  .add { display: flex; gap: 6px; margin-bottom: 10px; }
  .add input {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 17px; color: var(--text);
    background: rgba(0,0,0,.45); border: 1px solid var(--line); border-left: 3px solid var(--dim); outline: none;
  }
  .add input::placeholder { color: var(--dim); text-transform: uppercase; letter-spacing: 1.5px; font-size: 14px; }
  .add input:focus { border-left-color: var(--go-hi); background: rgba(0,0,0,.6); }
  .btn-go {
    padding: 0 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #fff;
    background: linear-gradient(180deg, var(--go-hi), var(--go));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-go:disabled, .btn-go.is-full { filter: grayscale(1) brightness(.55); }
  .btn-go:disabled { cursor: default; }
  .btn-go:not(:disabled):active { filter: brightness(1.15); }

  /* ---------- toolbar ---------- */
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  .tool {
    padding: 9px 2px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px;
    background: var(--panel-2); color: #c9d2df; border-bottom: 2px solid rgba(255,255,255,.08);
  }
  .tool:active { background: #2c3a4f; color: #fff; }
  .tool.danger { color: #f08a82; }

  /* ---------- panels ---------- */
  .panel { margin-bottom: 12px; background: var(--panel); backdrop-filter: blur(4px);
    border: 1px solid var(--line); transition: box-shadow .15s; }
  .panel.drop { box-shadow: 0 0 0 2px var(--go-hi); }
  .head { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px;
    background: linear-gradient(90deg, rgba(255,255,255,.07), transparent 75%); border-bottom: 2px solid var(--dim); }
  .panel[data-zone="A"] .head { background: linear-gradient(90deg, var(--ct-deep), rgba(29,51,88,.15) 75%); border-bottom-color: var(--ct); }
  .panel[data-zone="B"] .head { background: linear-gradient(90deg, var(--t-deep), rgba(74,52,19,.15) 75%); border-bottom-color: var(--t); }
  .panel.map-panel .head { border-bottom-color: var(--go); background: linear-gradient(90deg, rgba(79,156,58,.22), transparent 75%); }

  .side {
    flex: none; width: 34px; height: 30px; display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #0b0f16;
    clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
    background: linear-gradient(180deg, #9aa4b4, #5d6778);
  }
  .panel[data-zone="A"] .side { background: linear-gradient(180deg, var(--ct-hi), var(--ct)); }
  .panel[data-zone="B"] .side { background: linear-gradient(180deg, var(--t-hi), var(--t)); }
  .map-panel .side { background: linear-gradient(180deg, #9be07f, var(--go)); }

  .team-name {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 2px 0;
    font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #fff;
    border-bottom: 1px dashed transparent;
  }
  .team-name:focus { border-bottom-color: rgba(255,255,255,.35); }
  .label { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #c9d2df; }
  .slots { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .panel[data-zone="A"] .slots.full { color: var(--ct-hi); }
  .panel[data-zone="B"] .slots.full { color: var(--t-hi); }
  .mini {
    --cut: 5px; padding: 5px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    background: rgba(255,255,255,.08); color: #c9d2df;
  }
  .mini.on { background: var(--go); color: #fff; }

  .list { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row:nth-child(even) { background: rgba(255,255,255,.025); }
  .num { width: 30px; text-align: center; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .player { cursor: grab; box-shadow: inset 3px 0 0 var(--dim); }
  .player.dragging { opacity: .35; }
  .panel[data-zone="A"] .player { box-shadow: inset 3px 0 0 var(--ct); }
  .panel[data-zone="B"] .player { box-shadow: inset 3px 0 0 var(--t); }
  .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-weight: 600; }
  .panel[data-zone="A"] .pname { color: var(--ct-hi); }
  .panel[data-zone="B"] .pname { color: var(--t-hi); }
  .empty-slot .pname { color: var(--dim) !important; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; }
  .note { padding: 14px; text-align: center; color: var(--dim); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }

  .acts { display: flex; gap: 4px; }
  .act { --cut: 5px; width: 38px; height: 32px; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.06); color: #c9d2df; }
  .act.a { color: var(--ct-hi); background: rgba(91,143,216,.18); }
  .act.b { color: var(--t-hi); background: rgba(224,166,60,.18); }
  .act.a:active { background: var(--ct); color: #fff; }
  .act.b:active { background: var(--t); color: #0b0f16; }
  .act.x:active { background: var(--red); color: #fff; }
  .act:disabled { opacity: .25; cursor: default; }

  /* ---------- regulars ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; }
  .chip {
    --cut: 6px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 16px; font-weight: 600;
    background: rgba(255,255,255,.06); color: #aeb8c7; border-bottom: 2px solid transparent;
  }
  .chip .mark { font-size: 13px; color: var(--dim); }
  .chip.in { background: rgba(79,156,58,.22); color: #fff; border-bottom-color: var(--go-hi); }
  .chip.in .mark { color: var(--go-hi); }
  .chip.edit { background: rgba(216,70,60,.14); color: #f3b3ad; }
  .chip.edit .mark { color: #f08a82; }
  .chip:active { filter: brightness(1.25); }

  /* ---------- maps ---------- */
  .map-status { padding: 10px 12px 0; font-size: 14px; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); min-height: 28px; }
  .map-status b { color: #fff; }
  .map-status .ta { color: var(--ct-hi); } .map-status .tb { color: var(--t-hi); } .map-status .ok { color: var(--go-hi); }
  .maps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px; }
  .map {
    --cut: 7px; position: relative; overflow: hidden; height: 78px; padding: 6px 8px; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    transition: filter .15s, opacity .15s;
  }
  .map .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .map .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.1) 20%, rgba(0,0,0,.72)); }
  .map span { position: relative; }
  .map small { position: absolute; top: 4px; right: 4px; padding: 1px 5px; font-size: 10px; letter-spacing: 1.5px; background: rgba(0,0,0,.55); }
  .map small:empty { display: none; }
  .map.picked::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--go-hi); }
  .map.picked small { color: var(--go-hi); }
  .map.banned { filter: grayscale(1) brightness(.4); }
  .map.banned span { text-decoration: line-through; }
  .map.banned.ba small { color: var(--ct-hi); }
  .map.banned.bb small { color: var(--t-hi); }
  .map:disabled { cursor: default; }
  .map-actions { display: flex; gap: 6px; padding: 0 10px 10px; }
  .map-actions .tool { flex: 1; }

  .share { width: 100%; padding: 14px; font-size: 18px; margin-top: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); max-width: 90vw;
    padding: 10px 18px; background: rgba(8,11,16,.95); color: #fff; font-size: 15px; letter-spacing: 1.5px;
    text-transform: uppercase; border-left: 3px solid var(--go-hi);
    opacity: 0; pointer-events: none; transition: .18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-left-color: var(--red); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="cut">
    <div>
      <div class="eyebrow">Competitive · 5v5</div>
      <h1>Match Lobby</h1>
    </div>
    <div class="counter">
      <b id="count">0<span>/10</span></b>
      <small>Players</small>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <input id="nameInput" maxlength="24" placeholder="Enter player name" enterkeyhint="done" />
    <button class="btn-go cut" id="addBtn" type="submit">Add</button>
  </form>

  <section class="panel cut" id="regulars">
    <div class="head">
      <span class="side">★</span>
      <span class="label">Regulars</span>
      <button class="mini cut" id="editRoster" type="button">Edit</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <div class="tools">
    <button class="tool cut" id="shuffleBtn">Random</button>
    <button class="tool cut" id="swapBtn">Swap</button>
    <button class="tool cut" id="benchBtn">Reset</button>
    <button class="tool cut danger" id="clearBtn">Clear</button>
  </div>

  <section class="panel cut" data-zone="A">
    <div class="head">
      <span class="side">A</span>
      <input class="team-name" id="nameA" maxlength="20" aria-label="Team A name" />
      <span class="slots" id="slotsA"></span>
    </div>
    <div class="list" id="listA"></div>
  </section>

  <section class="panel cut" data-zone="B">
    <div class="head">
      <span class="side">B</span>
      <input class="team-name" id="nameB" maxlength="20" aria-label="Team B name" />
      <span class="slots" id="slotsB"></span>
    </div>
    <div class="list" id="listB"></div>
  </section>

  <section class="panel cut" data-zone="P">
    <div class="head">
      <span class="side">?</span>
      <span class="label">Unassigned</span>
      <span class="slots" id="slotsP"></span>
    </div>
    <div class="list" id="listP"></div>
  </section>

  <section class="panel cut map-panel">
    <div class="head">
      <span class="side">M</span>
      <span class="label">Map</span>
      <button class="mini cut" id="modePick" type="button">Pick</button>
      <button class="mini cut" id="modeVeto" type="button">Veto</button>
    </div>
    <div class="map-status" id="mapStatus"></div>
    <div class="maps" id="maps"></div>
    <div class="map-actions">
      <button class="tool cut" id="randomMap" type="button">Random map</button>
      <button class="tool cut" id="resetMap" type="button">Reset map</button>
    </div>
  </section>

  <button class="btn-go cut share" id="shareWeb">Share lineup</button>
</div>
<div class="toast" id="toast"></div>

      <path d="M42 50q2-4 5 0M110 46q3-4 6 0" stroke="#c84ab0" stroke-width="1.2" fill="none"/>
      <rect x="10" y="48" width="2.4" height="12" fill="#5a3e2a"/><rect x="146" y="46" width="2.4" height="14" fill="#5a3e2a"/>
      <g fill="#3f7a3e"><circle cx="6" cy="44" r="8"/><circle cx="16" cy="40" r="9"/><circle cx="142" cy="40" r="9"/><circle cx="154" cy="44" r="8"/></g>
      <g fill="#66a35a"><circle cx="12" cy="38" r="5"/><circle cx="148" cy="38" r="5"/></g>
      <rect x="84" y="40" width="1.2" height="18" fill="#3a3a3a"/><circle cx="84.6" cy="40" r="1.6" fill="#ffeaa0"/>
      <rect x="66" y="54" width="14" height="1.6" fill="#6a4a2a"/><rect x="66" y="51" width="14" height="1" fill="#6a4a2a"/><path d="M67 55.6v3M79 55.6v3" stroke="#3a2a1a" stroke-width=".8"/>
      <rect y="58" width="160" height="6" fill="#5f9a50"/><rect y="63" width="160" height="2" fill="#9aa0a5"/>
      <rect y="65" width="160" height="15" fill="url(#ov-w)"/>
      <path d="M20 70h18M70 69h22M118 71h16M44 74h12M96 75h14" stroke="#9cd0da" stroke-width=".8"/>` },

    { name: "Vertigo", slug: "vertigo", c1: "#2a5a8a", c2: "#9cc6e6", art: `
      <defs>
        <linearGradient id="vt-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5f9fe0"/><stop offset="1" stop-color="#bfe0f8"/></linearGradient>
        <pattern id="vt-win" width="4" height="5" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="2" height="2.5" fill="#d8eafa" opacity=".6"/></pattern>
      </defs>
      <rect width="160" height="80" fill="url(#vt-sky)"/>
      <g fill="#fff" opacity=".7"><ellipse cx="30" cy="10" rx="14" ry="3"/><ellipse cx="66" cy="16" rx="10" ry="2.4"/></g>
      <g fill="#7ea6d0"><rect x="2" y="30" width="16" height="40"/><rect x="20" y="18" width="12" height="52"/><rect x="34" y="34" width="18" height="36"/><rect x="56" y="26" width="14" height="44"/><rect x="90" y="22" width="16" height="48"/><rect x="108" y="38" width="12" height="32"/></g>
      <g fill="url(#vt-win)"><rect x="2" y="30" width="16" height="40"/><rect x="20" y="18" width="12" height="52"/><rect x="34" y="34" width="18" height="36"/><rect x="56" y="26" width="14" height="44"/><rect x="90" y="22" width="16" height="48"/><rect x="108" y="38" width="12" height="32"/></g>
      <path d="M26 18v-6M98 22v-8" stroke="#6a8fb8" stroke-width=".8"/>
      <g fill="#4f78a6"><rect x="12" y="40" width="14" height="30"/><rect x="64" y="40" width="16" height="30"/><rect x="100" y="44" width="14" height="26"/></g>
      <g fill="url(#vt-win)"><rect x="12" y="40" width="14" height="30"/><rect x="64" y="40" width="16" height="30"/><rect x="100" y="44" width="14" height="26"/></g>
      <rect x="122" y="8" width="4" height="54" fill="none" stroke="#e0b030" stroke-width=".8"/>
      <path d="M122 8L126 12L122 16L126 20L122 24L126 28L122 32L126 36L122 40L126 44L122 48L126 52L122 56L126 60" stroke="#e0b030" stroke-width=".6" fill="none"/>
      <rect x="84" y="5" width="70" height="3" fill="none" stroke="#e0b030" stroke-width=".8"/>
      <path d="M84 8L88 5L92 8L96 5L100 8L104 5L108 8L112 5L116 8L120 5M130 5L134 8L138 5L142 8L146 5L150 8L154 5" stroke="#e0b030" stroke-width=".5" fill="none"/>
      <path d="M124 0V5M124 0L90 5M124 0L152 5" stroke="#555" stroke-width=".4"/>
      <rect x="126" y="9" width="7" height="5" fill="#e0b030"/><rect x="127" y="10" width="3" height="2" fill="#bfe0f8"/>
      <rect x="142" y="8" width="11" height="5" fill="#555"/>
      <path d="M96 8V34" stroke="#333" stroke-width=".5"/><path d="M96 34q-1.5 2 0 3" stroke="#333" stroke-width=".7" fill="none"/>
      <rect x="89" y="37" width="14" height="2.4" fill="#6a6f76"/>
      <rect y="60" width="160" height="20" fill="#8f949b"/><path d="M0 64h160M0 70h160" stroke="#7d828a" stroke-width=".5"/>
      <path d="M0 61h160" stroke="#222" stroke-width="3"/><path d="M0 61h160" stroke="#e0b030" stroke-width="3" stroke-dasharray="5 5"/>
      <path d="M6 59V36M18 59V36M30 59V36M6 36H30M6 44H30M6 52H30M6 59L18 44L30 59M6 44L18 36" stroke="#9aa3ac" stroke-width="1" fill="none"/>
      <rect x="4" y="44" width="28" height="1.4" fill="#b8865a"/><rect x="4" y="52" width="28" height="1.4" fill="#b8865a"/>
      <polygon points="58,60 82,60 80,51 61,53" fill="#2f6fb8"/><path d="M62 53l2 7M70 52l1 8M76 51.5l1 8.5" stroke="#245a98" stroke-width=".5"/>
      <g fill="#b8a27a"><ellipse cx="100" cy="59" rx="4" ry="2"/><ellipse cx="108" cy="59" rx="4" ry="2"/><ellipse cx="104" cy="56.5" rx="4" ry="2"/></g>
      <rect x="136" y="52" width="10" height="8" fill="#d8d2c4"/><rect x="140" y="48" width="8" height="5" fill="#cbc4b4"/>
      <path d="M150 60V40M156 60V40M150 44h6M150 48h6M150 52h6M150 56h6" stroke="#6a6f76" stroke-width=".8"/>` },
  ];
  const photos = {};   // slug -> URL of a user-supplied photo that loaded OK
  MAPS.forEach(m => {
    const img = new Image();
    img.onload = () => { photos[m.slug] = img.src; renderMaps(); };
    img.src = `maps/${m.slug}.jpg`;
  });
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);

  // ---------- state ----------
  const defaults = { players: [], roster: [], nameA: "Team A", nameB: "Team B", map: null, mapMode: "pick", bans: [] };
  let state = Object.assign({}, defaults, load() || {});
  // older saves had no roster: seed it from the current lobby
  if (!state.roster.length && state.players.length) state.roster = state.players.map(p => p.name);
  function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  const uid = () => Math.random().toString(36).slice(2, 9);
  const same = (a, b) => a.toLowerCase() === b.toLowerCase();
  const inTeam = t => state.players.filter(p => p.team === t);
  const inLobby = name => state.players.find(p => same(p.name, name));
  const teamName = t => t === "A" ? state.nameA : state.nameB;
  let editRoster = false;

  // ---------- helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function haptic(type = "light") {
    if (!tg || !tg.HapticFeedback) return;
    if (["error", "success", "warning"].includes(type)) tg.HapticFeedback.notificationOccurred(type);
    else tg.HapticFeedback.impactOccurred(type);
  }
  let toastTimer;
  function toast(msg, err) {
    const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function fail(msg) { haptic("error"); toast(msg, true); }
  function confirmBox(msg, cb) {
    if (inTelegram && tg.showConfirm) tg.showConfirm(msg, ok => ok && cb());
    else if (confirm(msg)) cb();
  }

  // ---------- players ----------
  function remember(name) { if (!state.roster.some(n => same(n, name))) state.roster.push(name); }
  function joinLobby(name) {
    if (inLobby(name)) return fail(`${name} is already in the lobby`), false;
    if (state.players.length >= MAX_PLAYERS) return fail("Lobby full · remove a player first"), false;
    state.players.push({ id: uid(), name, team: "P" });
    return true;
  }
  function addPlayer(name) {
    name = name.trim();
    if (!name) { $("nameInput").focus(); return fail("Type a player name"); }
    const known = state.roster.some(n => same(n, name));
    if (state.players.length >= MAX_PLAYERS && !inLobby(name)) {
      remember(name); commit();
      return fail(known ? "Lobby full · remove a player first" : "Saved to regulars · lobby is full");
    }
    remember(name);
    if (joinLobby(name)) haptic();
    commit();
  }
  function toggleRegular(name) {
    if (editRoster) {
      state.roster = state.roster.filter(n => !same(n, name));
      haptic("medium"); return commit();
    }
    const p = inLobby(name);
    if (p) { state.players = state.players.filter(x => x !== p); haptic(); }
    else if (joinLobby(name)) haptic();
    commit();
  }
  function move(id, team) {
    const p = state.players.find(p => p.id === id);
    if (!p || p.team === team) return;
    if (team !== "P" && inTeam(team).length >= TEAM_SIZE) return fail(`${teamName(team)} is full`);
    p.team = team; haptic(); commit();
  }
  function remove(id) { state.players = state.players.filter(p => p.id !== id); haptic("medium"); commit(); }
  function shuffle() {
    if (state.players.length < 2) return fail("Add players first");
    const arr = [...state.players];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    const half = Math.ceil(arr.length / 2);
    arr.forEach((p, i) => p.team = i < Math.min(half, TEAM_SIZE) ? "A" : (i < half + TEAM_SIZE ? "B" : "P"));
    state.players = arr; haptic("success"); commit(); toast("Teams randomized");
  }
  function swap() { state.players.forEach(p => { if (p.team !== "P") p.team = p.team === "A" ? "B" : "A"; }); haptic(); commit(); toast("Sides swapped"); }
  function bench() { state.players.forEach(p => p.team = "P"); haptic(); commit(); }
  function clearAll() { confirmBox("Remove all players from the lobby? Your regulars stay saved.", () => { state.players = []; haptic("warning"); commit(); }); }

  // ---------- maps ----------
  const remaining = () => MAPS.filter(m => !state.bans.some(b => b.map === m.name));
  const nextBanTeam = () => state.bans.length % 2 === 0 ? "A" : "B";
  function setMode(mode) {
    if (state.mapMode === mode) return;
    state.mapMode = mode; state.map = null; state.bans = []; haptic(); commit();
  }
  function tapMap(name) {
    if (state.mapMode === "pick") {
      state.map = state.map === name ? null : name; haptic(); return commit();
    }
    // veto
    if (state.map) return fail("Veto finished · tap Reset map");
    if (state.bans.some(b => b.map === name)) {
      const last = state.bans[state.bans.length - 1];
      if (last.map !== name) return fail("Only the last ban can be undone");
      state.bans.pop(); haptic(); return commit();
    }
    state.bans.push({ map: name, team: nextBanTeam() });
    const left = remaining();
    if (left.length === 1) { state.map = left[0].name; haptic("success"); toast(`${state.map} is the decider`); }
    else haptic();
    commit();
  }
  function randomMap() {
    if (state.mapMode === "veto") state.mapMode = "pick", state.bans = [];
    let pool = MAPS.filter(m => m.name !== state.map);
    state.map = pool[Math.floor(Math.random() * pool.length)].name;
    haptic("success"); commit(); toast(`Map: ${state.map}`);
  }
  function resetMap() { state.map = null; state.bans = []; haptic(); commit(); }

  // ---------- share ----------
  function lineupText() {
    const fmt = t => inTeam(t).map((p, i) => `${i + 1}. ${p.name}`).join("\n") || "—";
    let text = `🎮 5v5 Lineup\n\n🔵 ${state.nameA}\n${fmt("A")}\n\n🟠 ${state.nameB}\n${fmt("B")}`;
    if (state.map) text += `\n\n🗺 Map: ${state.map}`;
    if (state.bans.length) text += `\n🚫 Bans: ${state.bans.map(b => `${b.map} (${teamName(b.team)})`).join(", ")}`;
    return text;
  }
  function share() {
    const text = lineupText();
    if (inTelegram) {
      tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(" ") + "&text=" + encodeURIComponent(text));
    } else if (navigator.share) {
      navigator.share({ text }).catch(() => {});
    } else {
      navigator.clipboard.writeText(text).then(() => toast("Lineup copied"), () => fail("Copy failed"));
    }
  }

  // ---------- render ----------
  function playerRow(p, idx) {
    const el = document.createElement("div");
    el.className = "row player"; el.dataset.id = p.id; el.draggable = true;
    const num = document.createElement("span"); num.className = "num"; num.textContent = idx + 1;
    const name = document.createElement("span"); name.className = "pname"; name.textContent = p.name;
    const acts = document.createElement("div"); acts.className = "acts";
    const mk = (label, cls, fn, disabled, title) => {
      const b = document.createElement("button"); b.className = "act cut " + cls; b.textContent = label;
      b.title = title; b.setAttribute("aria-label", title); b.disabled = disabled; b.onclick = fn; acts.append(b);
    };
    if (p.team !== "A") mk("A", "a", () => move(p.id, "A"), inTeam("A").length >= TEAM_SIZE, `Move ${p.name} to ${state.nameA}`);
    if (p.team !== "B") mk("B", "b", () => move(p.id, "B"), inTeam("B").length >= TEAM_SIZE, `Move ${p.name} to ${state.nameB}`);
    if (p.team !== "P") mk("↓", "x", () => move(p.id, "P"), false, `Unassign ${p.name}`);
    else mk("✕", "x", () => remove(p.id), false, `Remove ${p.name} from lobby`);
    el.append(num, name, acts);
    el.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", p.id); el.classList.add("dragging"); });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
    return el;
  }
  function emptyRow(idx) {
    const el = document.createElement("div"); el.className = "row empty-slot";
    el.innerHTML = `<span class="num">${idx + 1}</span><span class="pname">Empty slot</span>`;
    return el;
  }
  function renderRegulars() {
    const box = $("chips"); box.innerHTML = "";
    $("editRoster").textContent = editRoster ? "Done" : "Edit";
    $("editRoster").classList.toggle("on", editRoster);
    $("editRoster").style.visibility = state.roster.length ? "visible" : "hidden";
    if (!state.roster.length) { box.innerHTML = `<div class="note" style="width:100%">Players you add are saved here</div>`; return; }
    [...state.roster].sort((a, b) => a.localeCompare(b)).forEach(name => {
      const on = !!inLobby(name);
      const c = document.createElement("button");
      c.type = "button"; c.className = "chip cut" + (editRoster ? " edit" : on ? " in" : "");
      c.innerHTML = `<span class="mark">${editRoster ? "✕" : on ? "✓" : "+"}</span>${esc(name)}`;
      c.setAttribute("aria-label", editRoster ? `Delete ${name} from regulars` : on ? `Remove ${name} from lobby` : `Add ${name} to lobby`);
      c.onclick = () => toggleRegular(name);
      box.append(c);
    });
  }
  function renderMaps() {
    const veto = state.mapMode === "veto";
    $("modePick").classList.toggle("on", !veto);
    $("modeVeto").classList.toggle("on", veto);
    $("randomMap").style.display = veto ? "none" : "";
    const st = $("mapStatus");
    if (state.map) st.innerHTML = `${veto ? "Decider" : "Picked"}: <b class="ok">${esc(state.map)}</b>`;
    else if (veto) {
      const t = nextBanTeam();
      st.innerHTML = `<b class="${t === "A" ? "ta" : "tb"}">${esc(teamName(t))}</b> bans · ${remaining().length} maps left`;
    } else st.textContent = "Tap a map to pick it";

    const box = $("maps"); box.innerHTML = "";
    MAPS.forEach(m => {
      const ban = state.bans.find(b => b.map === m.name);
      const picked = state.map === m.name;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "map cut" + (picked ? " picked" : "") + (ban ? " banned b" + ban.team.toLowerCase() : "");
      b.style.setProperty("--c1", m.c1); b.style.setProperty("--c2", m.c2);
      const tag = picked ? (veto ? "Decider" : "Picked") : ban ? `${ban.team} ban` : "";
      const pic = photos[m.slug]
        ? `<img class="art" src="${photos[m.slug]}" alt="">`
        : `<svg class="art" viewBox="0 0 160 80" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${m.art}</svg>`;
      b.innerHTML = `${pic}<i class="shade"></i><small>${tag}</small><span>${esc(m.name)}</span>`;
      b.setAttribute("aria-label", `${m.name}${tag ? " — " + tag : ""}`);
      b.onclick = () => tapMap(m.name);
      box.append(b);
    });
  }
  function render() {
    for (const t of ["A", "B", "P"]) {
      const list = $("list" + t); list.innerHTML = "";
      const ps = inTeam(t);
      ps.forEach((p, i) => list.append(playerRow(p, i)));
      if (t === "P") {
        if (!ps.length) list.innerHTML = `<div class="note">${state.players.length ? "All players assigned" : "Add players to start"}</div>`;
        $("slotsP").textContent = ps.length || "";
      } else {
        for (let i = ps.length; i < TEAM_SIZE; i++) list.append(emptyRow(i));
        const s = $("slots" + t); s.textContent = `${ps.length}/${TEAM_SIZE}`; s.classList.toggle("full", ps.length === TEAM_SIZE);
      }
    }
    const n = state.players.length;
    $("count").innerHTML = `${n}<span>/${MAX_PLAYERS}</span>`;
    $("addBtn").classList.toggle("is-full", n >= MAX_PLAYERS);
    $("nameInput").placeholder = n >= MAX_PLAYERS ? "Lobby full" : `Player ${n + 1} name`;
    if (document.activeElement !== $("nameA")) $("nameA").value = state.nameA;
    if (document.activeElement !== $("nameB")) $("nameB").value = state.nameB;
    renderRegulars();
    renderMaps();

    const a = inTeam("A").length, b = inTeam("B").length, ready = a === TEAM_SIZE && b === TEAM_SIZE;
    const label = ready ? "Share lineup · Ready" : `Share lineup · ${a}v${b}`;
    if (inTelegram) {
      $("shareWeb").style.display = "none";
      tg.MainButton.setParams({ text: label.toUpperCase(), color: ready ? "#4f9c3a" : "#2c3a4f", text_color: "#ffffff" });
      a + b ? tg.MainButton.show() : tg.MainButton.hide();
    } else {
      $("shareWeb").disabled = !(a + b);
      $("shareWeb").textContent = label;
    }
  }
  function commit() { save(); render(); }

  // ---------- events ----------
  $("addForm").addEventListener("submit", e => { e.preventDefault(); addPlayer($("nameInput").value); $("nameInput").value = ""; $("nameInput").focus(); });
  $("editRoster").onclick = () => { editRoster = !editRoster; haptic(); render(); };
  $("shuffleBtn").onclick = shuffle;
  $("swapBtn").onclick = swap;
  $("benchBtn").onclick = bench;
  $("clearBtn").onclick = clearAll;
  $("modePick").onclick = () => setMode("pick");
  $("modeVeto").onclick = () => setMode("veto");
  $("randomMap").onclick = randomMap;
  $("resetMap").onclick = resetMap;
  $("shareWeb").onclick = share;
  for (const t of ["A", "B"]) {
    const inp = $("name" + t);
    inp.addEventListener("input", () => { state["name" + t] = inp.value.trim() || `Team ${t}`; save(); });
    inp.addEventListener("blur", render);
  }
  document.querySelectorAll(".panel[data-zone]").forEach(sec => {
    sec.addEventListener("dragover", e => { e.preventDefault(); sec.classList.add("drop"); });
    sec.addEventListener("dragleave", () => sec.classList.remove("drop"));
    sec.addEventListener("drop", e => { e.preventDefault(); sec.classList.remove("drop"); move(e.dataTransfer.getData("text/plain"), sec.dataset.zone); });
  });

  // ---------- telegram ----------
  if (tg) {
    tg.ready(); tg.expand();
    if (inTelegram) {
      tg.MainButton.onClick(share);
      try { tg.setHeaderColor("#0b0f16"); tg.setBackgroundColor("#07090e"); } catch {}
    }
  }
  render();
})();
</script>
